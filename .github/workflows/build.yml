name: Build & Test

on:
  push:
    branches: [main, develop_work]
  pull_request:
    branches: [main, develop_work]

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Ninja
      uses: seanmiddleditch/gha-setup-ninja@v3

    - name: Setup MSVC Environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Configure CMake
      run: cmake --preset ci-win

    - name: Build
      run: cmake --build build/dev-win --config Debug

    - name: Build Tests
      run: cmake --build build/dev-win --target carhmi_core_tests carhmi_gui_tests

    - name: Run Tests
      run: cd build/dev-win && ctest --output-on-failure
